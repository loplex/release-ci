name: draft
description: >-
  Push the release branch and draft the release from it, once the build has succeeded. The notes are the
  released section of CHANGELOG.md; the files are those `files` names, and none where it is left empty; a
  version with a pre-release suffix is marked as one. A draft standing from an earlier run is replaced. The
  tag is named but not created - GitHub creates it when the draft is published - so a draft thrown away
  leaves no tag behind. Runs where release-flow/prepare left the workspace, and needs `contents: write` on
  the job.
  Needs `gh` and python3 3.10 or later, which GitHub-hosted runners carry.

inputs:
  source:
    description: >-
      Where the version a release is asked to be comes from, passed to check-release as `--source`:
      `gradle.properties`, or `tags` for a repository that declares no version.
    required: true
  tag-prefix:
    description: >-
      What release tags carry in front of the version. Left out where the source declares it; `^none` where
      the tags carry no prefix at all.
    default: ''
  version:
    description: The version being released, as release-flow/prepare gives it.
    required: true
  tag:
    description: The tag the release will carry, as release-flow/prepare gives it.
    required: true
  branch:
    description: The branch holding the release commit, as release-flow/prepare gives it.
    required: true
  files:
    description: >-
      What to attach, one pattern or path per line - a `|` block in YAML - so that a path may hold a space; a
      blank line is skipped, and a pattern is a bash glob, in which `**` goes no deeper than `*`. A pattern
      matching nothing, or a path naming no file, fails the run rather than being passed on as text. Left
      empty, nothing is attached.
    default: ''
  token:
    description: >-
      The token `gh` acts with, to replace and create the draft. The branch is pushed with whatever
      actions/checkout persisted, not with this.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        VERSION: ${{ inputs.version }}
        TAG: ${{ inputs.tag }}
        BRANCH: ${{ inputs.branch }}
        FILES: ${{ inputs.files }}
        GH_TOKEN: ${{ inputs.token }}
      run: "$GITHUB_ACTION_PATH/draft.sh"
