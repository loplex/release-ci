# This repository's test suites, run on every push and pull request.
# - `suite` takes its Python from .python-version, so the tests run on the version they are written against.
# - `oldest-python` runs the suites that reach the actions' code again, on the oldest python3 the actions ask for.
# - `guards` uses the runner's own python3, as any repository using the action does.
name: test

on:
  push:
  pull_request:
  # Asked for by release-publish.yml once a release has landed: a push made with GITHUB_TOKEN starts no run.
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: python3 -m unittest discover -s check-release
      - run: python3 -m unittest discover -s release-flow
      - run: python3 -m unittest discover -s intellij
      - run: python3 -m pip install -r .github/requirements.txt
      - run: python3 -m unittest discover -s .github

  oldest-python:
    # The actions run on the caller's own python3, and their descriptions ask for 3.10 or later.
    # The suites run the actions' code in-process and through python3 on PATH, which setup-python makes 3.10 here.
    # So anything newer than 3.10 in the code the suites reach fails this job, while `suite` passes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python3 .github/unittest-3.10.py check-release
      - run: python3 .github/unittest-3.10.py release-flow
      - run: python3 .github/unittest-3.10.py intellij

  guards:
    # The checks run against this repository through the check-release action, so this job is its first user.
    # The repository declares no version in a file, so it uses the `tags` source in its simplest form.
    # The default checks leave out `version`: it asks what may be released next, a question for a release,
    # not for every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # ancestry reads the whole history, and both default checks read the tags.
      - uses: ./check-release
        with:
          version-source: tags
          tag-prefix: v
