name: draft
description: |
  Pushes the release branch and drafts the release from it, once the build has succeeded.
  - The notes are the version's section of CHANGELOG.md.
  - The files are the ones `files` names, and none when it is empty.
  - A version with a pre-release suffix is marked as a pre-release.
  - A draft of the same tag left by an earlier run is replaced.

  The tag is named but not created.
  GitHub creates it when the draft is published, so a draft that is thrown away leaves no tag behind.

  Runs where release-flow/prepare left the workspace.
  Needs `contents: write` on the job.
  Needs `gh` and python3 3.10 or later. GitHub-hosted runners have both.

inputs:
  version:
    description: |
      The version being released, as release-flow/prepare gives it.
    required: true
  tag:
    description: |
      The tag the release will have, as release-flow/prepare gives it.
    required: true
  branch:
    description: |
      The branch that holds the release commit, as release-flow/prepare gives it.
    required: true
  files:
    description: |
      What to attach to the draft, one pattern or path per line.
      Use a `|` block in YAML, so that a path may contain a space.
      - A blank line is skipped.
      - A pattern is a bash glob, in which `**` goes no deeper than `*`.
      - A pattern that matches nothing, or a path that names no file, fails the run.

      Left empty, nothing is attached.
    default: ''
  token:
    description: |
      The token `gh` uses to replace and create the draft.
      The branch is pushed with the credentials actions/checkout left, not with this token.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
        TAG: ${{ inputs.tag }}
        BRANCH: ${{ inputs.branch }}
        FILES: ${{ inputs.files }}
        GH_TOKEN: ${{ inputs.token }}
      run: "$GITHUB_ACTION_PATH/draft.sh"
