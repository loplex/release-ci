name: build
description: >-
  Build, check, verify and sign an IntelliJ platform plugin from the commit the workspace is on, and say where
  the signed archive landed. Everything between release-flow/prepare and release-flow/draft for a JetBrains
  plugin, and nothing that is not: the version and the changelog were settled before this ran, and the draft
  that carries the archive comes after. The release runs with `source: gradle.properties`, whose `version`
  line release-flow/prepare rewrites, and the plugin has to take its version from that line. Needs the signing
  certificate chain and private key, without which there is no signed archive to hand on. The Plugin
  Verifier's report is uploaded as the artifact `pluginVerifier-result`, whether or not it passed. The build
  script has to be on the IntelliJ Platform Gradle Plugin 2.x, whose `verifyPlugin` runs the Plugin Verifier;
  under the Gradle IntelliJ Plugin 1.x it does not, and the build stops on finding no report. The report is
  looked for in `build/reports/pluginVerifier` under the workspace, so the plugin has to be the build's root
  project. Gradle is cached by setup-gradle's open-source `basic` provider, not by its default one, a
  proprietary component under Gradle's own terms.

inputs:
  java-version:
    description: >-
      The JDK Gradle runs on, which is a property of this pipeline rather than of the plugin: what a plugin
      compiles against is its own `jvmToolchain`, declared in its build script, and one targeting something
      older still builds here.
    default: '21'
  java-distribution:
    description: The JDK distribution setup-java is asked for.
    default: zulu
  certificate-chain:
    description: >-
      The certificate chain the plugin is signed with. `signPlugin` is handed it as the environment variable
      `CERTIFICATE_CHAIN`, which the build script's `signing` block has to read.
    required: true
  private-key:
    description: >-
      The private key the plugin is signed with, handed to `signPlugin` as `PRIVATE_KEY`, which the build script's
      `signing` block has to read as it does `CERTIFICATE_CHAIN`.
    required: true
  private-key-password:
    description: >-
      The password of that private key, handed to `signPlugin` as `PRIVATE_KEY_PASSWORD`, which the build script's
      `signing` block has to read as it does `CERTIFICATE_CHAIN`.
    required: true
  free-disk-space:
    description: >-
      Make room before the Plugin Verifier runs, which downloads an IDE for every release it checks against:
      jlumbroso/free-disk-space then removes the runner's Android, .NET and Haskell toolchains and its docker
      images, which this action's later steps, and release-flow's, do without; a calling job that needs any
      of them later leaves this off. The swap is left in place: without it, a build that runs short of memory
      is killed with nothing in its log pointing back here. Off by default; the free space is printed before
      and after `verifyPlugin`, so a run's log shows how much room the verifier took.
    default: 'false'
  archive-pattern:
    description: >-
      Where the signed archive lands, as a pattern under the workspace, a bash glob, in which `**` goes no
      deeper than `*`; exactly one file has to match it. The Plugin Verifier's report is looked for in
      `build/reports/pluginVerifier` whatever this says.
    default: build/distributions/*-signed.zip

outputs:
  archive:
    description: The signed archive, by path, for release-flow/draft to attach to the draft.
    value: ${{ steps.archive.outputs.archive }}

runs:
  using: composite
  steps:
    - if: inputs.free-disk-space == 'true'
      uses: jlumbroso/free-disk-space@v2.0.0
      with:
        preinstalled-runtimes: false
        large-packages: false

    - uses: actions/setup-java@v6
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}

    # The open-source cache, over the GitHub Actions cache. The default one is a proprietary component under
    # Gradle's own terms of use, and a caller of this action would be accepting them without having been asked.
    # https://github.com/gradle/actions/blob/main/docs/setup-gradle.md
    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic

    - shell: bash
      run: ./gradlew check

    # The room the Plugin Verifier has and the room it leaves, printed so that whether free-disk-space is needed
    # is read off a run rather than guessed. The IDEs it downloads land under the Gradle user home.
    - shell: bash
      run: df -h "$GITHUB_WORKSPACE" "$HOME"

    # The check the Marketplace runs itself before it serves a version, run here first and on the very commit
    # that is going to be published: an internal-API usage or an incompatibility with a supported IDE build
    # goes red here rather than after its draft has been published. `check` does not include it.
    # https://plugins.jetbrains.com/docs/marketplace/understanding-plugin-security.html
    # https://plugins.jetbrains.com/docs/marketplace/jetbrains-marketplace-approval-guidelines.html
    - shell: bash
      run: ./gradlew verifyPlugin

    - shell: bash
      run: "$GITHUB_ACTION_PATH/verifier-report.sh"

    - if: always()
      shell: bash
      run: df -h "$GITHUB_WORKSPACE" "$HOME"

    - if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pluginVerifier-result
        path: build/reports/pluginVerifier
        if-no-files-found: ignore

    - shell: bash
      env:
        CERTIFICATE_CHAIN: ${{ inputs.certificate-chain }}
        PRIVATE_KEY: ${{ inputs.private-key }}
        PRIVATE_KEY_PASSWORD: ${{ inputs.private-key-password }}
      run: ./gradlew signPlugin

    - id: archive
      shell: bash
      env:
        ARCHIVE_PATTERN: ${{ inputs.archive-pattern }}
      run: "$GITHUB_ACTION_PATH/archive.sh"
