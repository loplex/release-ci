name: build
description: |
  Builds, checks, verifies and signs an IntelliJ Platform plugin from the commit the workspace is on,
  and says where the signed archive landed.

  It is the step between release-flow/prepare and release-flow/draft for a JetBrains plugin, and nothing more.
  The version and the changelog are settled before it runs, and the draft that carries the archive comes after.

  What the build script has to do:
  - Take the plugin's version from the `version` line of gradle.properties.
    The release runs with `version-source: gradle.properties`, and release-flow/prepare rewrites that line.
    The signed archive's plugin.xml is checked against that line, and the build stops where they differ.
  - Read the signing certificate chain and private key in its `signing` block, from the environment.
    Without them there is no signed archive.
  - Use the IntelliJ Platform Gradle Plugin 2.x, whose `verifyPlugin` runs the Plugin Verifier.
    Under the Gradle IntelliJ Plugin 1.x it does not, and the build stops when it finds no report.
  - Build the plugin as the root project: the report is looked for in `build/reports/pluginVerifier`
    under the workspace.

  The Plugin Verifier's report is uploaded as the artifact `pluginVerifier-result`, whether or not it passed.
  Gradle is cached by setup-gradle's open-source `basic` provider.
  The default provider is a proprietary component under Gradle's own terms.

  Installs the Python it runs on with actions/setup-python, leaving the job's own python3 as it was.

inputs:
  java-version:
    description: |
      The JDK Gradle runs on.
      This action's Gradle steps get it through their own JAVA_HOME: the calling job's JAVA_HOME and java are left
      as they were.
      This is a property of the pipeline, not of the plugin.
      What a plugin compiles against is its own `jvmToolchain` in its build script,
      so a plugin targeting an older Java still builds here.
    default: '21'
  java-distribution:
    description: |
      The JDK distribution setup-java is asked for.
    default: zulu
  certificate-chain:
    description: |
      The certificate chain the plugin is signed with.
      `signPlugin` gets it in the environment variable `CERTIFICATE_CHAIN`,
      which the build script's `signing` block has to read.
    required: true
  private-key:
    description: |
      The private key the plugin is signed with.
      `signPlugin` gets it in the environment variable `PRIVATE_KEY`,
      which the build script's `signing` block has to read.
    required: true
  private-key-password:
    description: |
      The password of that private key.
      `signPlugin` gets it in the environment variable `PRIVATE_KEY_PASSWORD`,
      which the build script's `signing` block has to read.
    required: true
  free-disk-space:
    description: |
      `true` makes room before the Plugin Verifier runs, which downloads an IDE for every release it checks against.
      jlumbroso/free-disk-space then removes the runner's Android, .NET and Haskell toolchains and its docker images.
      - This action's later steps, and release-flow's, do without them.
      - A calling job that needs any of them later leaves this off.
      - The swap is kept: without it, a build that runs out of memory is killed with nothing in its log
        pointing here.

      Off by default.
      The free space is printed before and after `verifyPlugin`, so a run's log shows how much room it took.
    default: 'false'
  change-notes:
    description: |
      `true` hands the build its change notes: the release's section of CHANGELOG.md, rendered as HTML.
      - The build gets them in the environment variable `CHANGE_NOTES`, in every Gradle step.
        Gradle then runs with `LC_ALL=C.UTF-8`: the JVM reads the environment in the locale's encoding.
      - The build script reads it in its `pluginConfiguration` block:
        `changeNotes = providers.environmentVariable("CHANGE_NOTES")`.
      - The signed archive's plugin.xml is checked to carry exactly them, and the build stops where it does not.
      - The section is the one for the version in gradle.properties, rendered by `lib/main.py notes --html`.
        Raw HTML in it is left out, comments included.
      - A relative link in it is made absolute, read at the release's tag, as GitHub reads it on the release page;
        an anchor alone leads into CHANGELOG.md instead.
        It needs the `tag` input.
      - The same notes, their links read at the commit checked out, are uploaded as the artifact
        `change-notes.html`, a page a browser opens before the tag exists.
      - cmarkgfm, which renders it, is installed from PyPI for the step, with the hashes lib/requirements.txt pins.

      Off by default: the action then sets no `CHANGE_NOTES`, and leaves one the job sets as it is.
      An empty one would give the plugin an empty `<change-notes />`.
    default: 'false'
  tag:
    description: |
      The tag the release is going to get: release-flow/prepare's `tag` output.
      Needed with `change-notes: true`, which reads a relative link at it; not read otherwise.
    default: ''
  archive-pattern:
    description: |
      Where the signed archive lands, as a bash glob under the workspace, in which `**` goes no deeper than `*`.
      Exactly one file has to match it.
      The Plugin Verifier's report is looked for in `build/reports/pluginVerifier` whatever this says.
    default: build/distributions/*-signed.zip

outputs:
  archive:
    description: |
      The path of the signed archive, for release-flow/draft to attach to the draft.
    value: ${{ steps.archive.outputs.archive }}

runs:
  using: composite
  steps:
    - if: inputs.free-disk-space == 'true'
      uses: jlumbroso/free-disk-space@v2.0.0
      with:
        preinstalled-runtimes: false
        large-packages: false

    # set-default: false leaves the calling job's JAVA_HOME and java as they were.
    # The Gradle steps below get this JDK through a JAVA_HOME of their own.
    # setup-java still points JAVA_HOME_<major>_<arch> at it and sets MAVEN_ARGS, for the rest of the job too.
    - id: java
      uses: actions/setup-java@v6
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
        set-default: false

    # The Python .python-version names, which renders the change notes and reads the signed archive at the end.
    # update-environment: false keeps it out of the calling job, whose steps go on with their own python3.
    - id: python
      uses: actions/setup-python@v7
      with:
        python-version-file: ${{ github.action_path }}/../../.python-version
        update-environment: false

    # The open-source cache, over the GitHub Actions cache. The default one is a proprietary component under
    # Gradle's own terms of use, and a caller of this action would be accepting them without having been asked.
    # https://github.com/gradle/actions/blob/main/docs/setup-gradle.md
    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic

    - id: notes
      if: inputs.change-notes == 'true'
      shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        TAG: ${{ inputs.tag }}
      run: |
        export LD_LIBRARY_PATH="${PYTHON%/bin/*}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        "$GITHUB_ACTION_PATH/notes.sh"

    # The notes as a page, uploaded whole rather than zipped, so that a browser opens it from the run.
    - if: inputs.change-notes == 'true'
      uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.notes.outputs.preview }}
        archive: false

    # Every Gradle step gets the change notes, so that each builds the plugin from the same input.
    # They come under a name of the action's own, and become CHANGE_NOTES only where there are some:
    # an empty CHANGE_NOTES would write an empty <change-notes />, and would hide one the job sets.
    # LC_ALL=C.UTF-8, because the JVM reads the environment in the locale's encoding, and the notes are UTF-8.
    - shell: bash
      env:
        JAVA_HOME: ${{ steps.java.outputs.path }}
        RELEASE_CI_CHANGE_NOTES: ${{ steps.notes.outputs.html }}
      run: |
        [[ -z $RELEASE_CI_CHANGE_NOTES ]] || export CHANGE_NOTES=$RELEASE_CI_CHANGE_NOTES LC_ALL=C.UTF-8
        ./gradlew check

    # The room the Plugin Verifier has and the room it leaves, printed so that whether free-disk-space is needed
    # is read off a run rather than guessed. The IDEs it downloads land under the Gradle user home.
    - shell: bash
      run: df -h "$GITHUB_WORKSPACE" "$HOME"

    # The check the Marketplace runs itself before it serves a version, run here first and on the very commit
    # that is going to be published: an internal-API usage or an incompatibility with a supported IDE build
    # goes red here rather than after its draft has been published. `check` does not include it.
    # https://plugins.jetbrains.com/docs/marketplace/understanding-plugin-security.html
    # https://plugins.jetbrains.com/docs/marketplace/jetbrains-marketplace-approval-guidelines.html
    - shell: bash
      env:
        JAVA_HOME: ${{ steps.java.outputs.path }}
        RELEASE_CI_CHANGE_NOTES: ${{ steps.notes.outputs.html }}
      run: |
        [[ -z $RELEASE_CI_CHANGE_NOTES ]] || export CHANGE_NOTES=$RELEASE_CI_CHANGE_NOTES LC_ALL=C.UTF-8
        ./gradlew verifyPlugin

    - shell: bash
      run: "$GITHUB_ACTION_PATH/verifier-report.sh"

    - if: always()
      shell: bash
      run: df -h "$GITHUB_WORKSPACE" "$HOME"

    - if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pluginVerifier-result
        path: build/reports/pluginVerifier
        if-no-files-found: ignore

    - shell: bash
      env:
        JAVA_HOME: ${{ steps.java.outputs.path }}
        CERTIFICATE_CHAIN: ${{ inputs.certificate-chain }}
        PRIVATE_KEY: ${{ inputs.private-key }}
        PRIVATE_KEY_PASSWORD: ${{ inputs.private-key-password }}
        RELEASE_CI_CHANGE_NOTES: ${{ steps.notes.outputs.html }}
      run: |
        [[ -z $RELEASE_CI_CHANGE_NOTES ]] || export CHANGE_NOTES=$RELEASE_CI_CHANGE_NOTES LC_ALL=C.UTF-8
        ./gradlew signPlugin

    - id: archive
      shell: bash
      env:
        ARCHIVE_PATTERN: ${{ inputs.archive-pattern }}
      run: "$GITHUB_ACTION_PATH/archive.sh"

    # Whether the archive is the release's, read before release-flow/draft pushes anything.
    # CHANGE_NOTES is the action's own here, empty with the input off: one the job sets is not checked.
    # -X utf8 reads it as UTF-8 whatever the locale, as LC_ALL=C.UTF-8 makes the JVM read it in the Gradle steps.
    - shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        ARCHIVE: ${{ steps.archive.outputs.archive }}
        CHANGE_NOTES: ${{ steps.notes.outputs.html }}
      # The Python setup-python installs finds its libpython through LD_LIBRARY_PATH in a job that runs in a container,
      # where the tool cache is mounted away from the path built into it. Set here, for this step alone.
      run: |
        export LD_LIBRARY_PATH="${PYTHON%/bin/*}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        "$PYTHON" -X utf8 "$GITHUB_ACTION_PATH/check-archive.py" "$ARCHIVE"
