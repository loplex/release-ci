name: publish
description: |
  Uploads an accepted plugin archive, the one a published draft carried, to the JetBrains Marketplace,
  and checks that the Marketplace serves it.

  The upload's own answer is reported but decides nothing.
  What decides is whether the Marketplace ends up serving the accepted archive.
  The served archive is downloaded and compared with the accepted one by payload,
  because a counter-signature rewrites the file without changing any entry.

  A plugin with no listing yet cannot be uploaded this way.
  - Its first version is uploaded by a person, as the archive the release carries.
  - Until that version is approved, the run fails once the attempts run out, as for a version that was not uploaded.
    The error names both causes, because it cannot tell them apart.
  - Once the first version is approved, run the job again. GitHub allows that for 30 days after the run started.

  An update is served as soon as it is uploaded, counter-signed.
  This is although JetBrains's approval guidelines say every update is reviewed before it is publicly available,
  and a JetBrains blog post says that an update to a custom channel is approved without a review
  where the plugin had an update approved in the default channel within the last 120 days.

  Needs `curl` and python3 3.10 or later. GitHub-hosted runners have both.

inputs:
  plugin-id:
    description: |
      The plugin's `xmlId`, as the Marketplace knows it.
    required: true
  version:
    description: |
      The version being published, without the tag prefix, as release-flow/merge-back gives it.
      The channel it goes to is read off its pre-release suffix by `check-release.py channel`:
      - `0.2.0-beta.1` goes to the channel `beta`.
      - A final release, such as `0.2.0`, names no channel, and goes where the Marketplace serves it by default.
    required: true
  archive:
    description: |
      The path of the accepted archive: the very file the draft carried.
    required: true
  token:
    description: |
      The Marketplace permanent token the upload is made with.
    required: true
  attempts:
    description: |
      How many times to ask the Marketplace for the version before giving up.
      A whole number from 1 to 9999.
    default: '10'
  wait:
    description: |
      Whole seconds between those attempts.
    default: '30'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PUBLISH_TOKEN: ${{ inputs.token }}
        PLUGIN_ID: ${{ inputs.plugin-id }}
        VERSION: ${{ inputs.version }}
        ARCHIVE: ${{ inputs.archive }}
        ATTEMPTS: ${{ inputs.attempts }}
        WAIT: ${{ inputs.wait }}
      run: "$GITHUB_ACTION_PATH/publish.sh"
