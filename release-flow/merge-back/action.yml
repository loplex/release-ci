name: merge-back
description: >-
  Carry a published release back onto the default branch: open the next version being worked on where the
  source declares one, take in whatever landed since the release was cut, and fast-forward the default branch
  onto the release branch, so that the release commit and its tag stay on the history. Where that cannot be
  done, because of a conflict, a merged tree the release rules refuse, a race, or a default branch that takes
  no push from the credential actions/checkout left in the workspace, it opens a pull request instead. The
  release commit is expected on the remote's release/<version>, a name that is not a setting. The run that
  lands the release deletes that branch, and a deletion that fails - a rule over the branch forbidding it,
  say - only warns; where a pull request carries the release instead, the branch is its head, and is left to
  whoever merges it. A run repeated once the release has landed finds it there and passes; one repeated while
  the pull request an earlier run opened is still open tries to land the release again, and leaves that pull
  request carrying it where it still cannot. Runs in the calling workspace, after a checkout with fetch-depth
  0, and the calling job needs `contents: write`, `pull-requests: write` and `actions: write` - the last
  because asking for a workflow run is a write to Actions and is answered 403 without it; the last two are
  asked of the default `token`, and one given in its place has to carry them itself. Opening the pull request
  with GITHUB_TOKEN takes a setting of the repository as well, "Allow GitHub Actions to create and approve
  pull requests", which a new personal repository has off, and merging it takes one more: merge commits have
  to be allowed. Needs `gh` and python3 3.10 or later, which GitHub-hosted runners carry.

inputs:
  source:
    description: >-
      Where the version a release is asked to be comes from, passed to check-release as `--source`:
      `gradle.properties`, or `tags` for a repository that declares no version.
    required: true
  tag-prefix:
    description: >-
      What release tags carry in front of the version. Left out where the source declares it; `^none` where
      the tags carry no prefix at all.
    default: ''
  tag:
    description: The tag of the release that was published, as `github.event.release.tag_name` gives it.
    required: true
  default-branch:
    description: >-
      The branch a release is carried back onto, as `github.event.repository.default_branch` gives it. Asked
      of the repository rather than written down, so that this says the same thing where it is called `main`
      and where it is called something else.
    required: true
  check-workflow:
    description: >-
      The workflow that checks the default branch, by file name, asked for once the release has landed: a push
      made with GITHUB_TOKEN starts no workflow run, so the branch would otherwise arrive unchecked. It has to
      list `workflow_dispatch` among its triggers: GitHub refuses to start one that does not, and the release
      has landed by then, so the run only warns.
      Left out, the run is refused before anything is carried back: GitHub does not hold an action to
      `required`, and a release landing with nothing asked to check it is what this input is there to stop.
    required: true
  token:
    description: >-
      The token `gh` acts with, to open the pull request and to ask for the check. The pushes are made with
      whatever actions/checkout persisted, not with this.
    default: ${{ github.token }}

outputs:
  version:
    description: >-
      The released version, with the tag prefix off. Written before anything is carried back, so a later step
      can read it even where carrying back failed.
    value: ${{ steps.merge-back.outputs.version }}
  next:
    description: >-
      The version that follows the released one, spelled the way the source spells one being worked on:
      `0.1.1-SNAPSHOT` under `gradle.properties`, a bare `0.1.1` under `tags`. Written to the source and
      opened with a commit of its own where the source declares a version; where it declares none, as with
      `tags`, only said.
    value: ${{ steps.merge-back.outputs.next }}
  landed:
    description: >-
      `true` where the release commit is on the default branch: carried there by this run, or found there by
      a run repeated after the release landed, whichever way it landed. `false` where it is not: a pull
      request carries the release instead, opened by this run or by an earlier one and still open, which is a
      thing to look at rather than a step of the process. Read it only after a step that succeeded: one that
      failed may have left it unset, or `false` with no pull request opened.
    value: ${{ steps.merge-back.outputs.landed }}

runs:
  using: composite
  steps:
    # One step calling one script, rather than the steps written out here: the shell is then something a test
    # can run against a repository of its own, which is not true of anything living inside action.yml.
    - id: merge-back
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        TAG: ${{ inputs.tag }}
        DEFAULT_BRANCH: ${{ inputs.default-branch }}
        CHECK_WORKFLOW: ${{ inputs.check-workflow }}
        GH_TOKEN: ${{ inputs.token }}
      run: "$GITHUB_ACTION_PATH/merge-back.sh"
