name: warn
description: |
  Says on a published release that publishing it somewhere else did not complete, or takes that back once it has.
  - Where the publishing step failed or did not run, it puts a warning at the start of the release notes,
    with a link to this run.
  - Where the step succeeded, it takes the warning off.

  The rest of the notes is left as it is.
  Notes that already say what this run would say are not touched.

  The warning is looked for only at the start of the notes.
  A line holding only one of its markers anywhere else fails the run, and the warning has to be removed by hand.

  Meant to follow the publishing step in the same job, under an `if` of `!cancelled()`,
  so that it runs whatever failed before it.
  Needs no checkout.
  Needs `contents: write` on the job.
  Needs `gh` and python3 3.10 or later. GitHub-hosted runners have both.

inputs:
  tag:
    description: |
      The tag of the published release whose notes carry the warning.
    required: true
  outcome:
    description: |
      The outcome of the publishing step, as `steps.<id>.outcome` gives it:
      - `success` takes the warning off.
      - `failure` and `skipped` put it on.
      - Anything else fails the run, including the empty value an id naming no step gives.

      `outcome` rather than `conclusion`, so that a step allowed to fail with `continue-on-error` still counts
      as failed.
    required: true
  to:
    description: |
      What the release is published to, as it reads in the middle of a sentence, on one line.
      For example: `the JetBrains Marketplace`.
    required: true
  token:
    description: |
      The token `gh` uses to read and write the release notes.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        TAG: ${{ inputs.tag }}
        OUTCOME: ${{ inputs.outcome }}
        TO: ${{ inputs.to }}
        RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        GH_TOKEN: ${{ inputs.token }}
        # The release is asked for in this repository by name, so that no checkout is needed to say which.
        GH_REPO: ${{ github.repository }}
      run: python3 "$GITHUB_ACTION_PATH/warn.py"
